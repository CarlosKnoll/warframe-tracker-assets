# On every version tag (v1.2.3): validate the icon map, then publish icons.json
# to the `releases` branch. The app reads that file to learn the current
# assetsVersion, then loads images from jsDelivr pinned to that exact tag.
name: release-manifest

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and build manifest
        run: VERSION="${GITHUB_REF_NAME}" node scripts/build-manifest.mjs

      - name: Publish manifest to the releases branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp dist/icons.json "$RUNNER_TEMP/icons.json"

          if git ls-remote --exit-code --heads origin releases >/dev/null 2>&1; then
            git fetch origin releases
            git checkout -B releases origin/releases
          else
            git checkout --orphan releases
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$RUNNER_TEMP/icons.json" icons.json
          git add icons.json
          git commit -m "manifest ${GITHUB_REF_NAME}" || echo "manifest unchanged"
          git push origin releases
